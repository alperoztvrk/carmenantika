name: Keep shop awake

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake carmenantika.com
        run: |
          curl -fsSL --retry 2 --retry-delay 8 --max-time 90 https://www.carmenantika.com/healthz
          curl -fsSL --retry 2 --retry-delay 8 --max-time 90 https://carmenantika.com/healthz
          curl -fsSL --retry 2 --retry-delay 8 --max-time 90 https://carmenantika.onrender.com/healthz
