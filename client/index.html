<!doctype html>
<html lang="tr" style="background-color:#f3ebdd;color-scheme:light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#f3ebdd" />
    <meta name="description" content="Carmen Antika — geçmişten gelen, bugün için seçilmiş parçalar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Carmen Antika — Geçmişten gelen, bugün için seçilmiş</title>
  </head>
  <body style="margin:0;background-color:#f3ebdd">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const website = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (typeof endpoint === "string" && endpoint && typeof website === "string" && website) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${endpoint.replace(/\/$/, "")}/umami`;
        script.dataset.websiteId = website;
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
