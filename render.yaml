services:
  - type: web
    name: carmen-antika
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://carmenantika.com
      - key: JWT_SECRET
        generateValue: true
      - key: LOCAL_ADMIN_PASSWORD
        sync: false
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
